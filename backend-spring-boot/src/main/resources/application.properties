# Spring Boot Server Configuration
server.port=8080
server.servlet.context-path=/api

# MySQL Database DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/sales_analytics_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload Multipart Limit
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# JWT Security
app.jwt.secret=9a6747f3a778795c656972e2cf5e6c7d2bf61a0f91a5e364947936a2e2b34762
app.jwt.expiration-ms=86400000

# Google Gemini API
gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=gemini-3.8-flash
